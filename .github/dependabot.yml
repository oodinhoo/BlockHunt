version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    # One pull request per week for minor and patch versions, majors stay separate.
    groups:
      dependencies:
        update-types: [minor, patch]
    # The Paper version is the Minecraft version the plugin targets, shown on each release:
    # moving to a new one is a deliberate change (plugin.yml api-version, README), not a bump.
    ignore:
      - dependency-name: io.papermc.paper:paper-api
    # Same as for the actions: never pick up a release the week it ships.
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A compromised release is usually caught within days: never pick one up the week it ships.
    # Each bump also updates .github/workflows/actions.lock.
    cooldown:
      default-days: 7
