# Once this many players joined, the game starts on its own after the countdown (2 at least).
# An admin can still /bh start at once.
min-players: 2
countdown-seconds: 30

# Seekers are blinded and frozen while hiders run.
hide-seconds: 30
seek-seconds: 300

# A hider standing still this long turns into a real-looking block.
solidify-seconds: 3

# A hider right-clicking a block of the map takes its look, at most once per cooldown.
change-cooldown-seconds: 30

seekers: 1

# Seekers' sonar (recovery compass): right-click rings a bell at every hider's position.
sonar-cooldown-seconds: 45

# Hiders' rocket: a loud sound at their position, paid back by time off the clock.
taunts: 2
# The closer to a seeker, the more: taunt-max-seconds right next to one, down in a straight line
# to nothing at taunt-range blocks. Farther than that, a taunt is refused and kept.
taunt-max-seconds: 30
taunt-range: 32

# Each hider gets one at random. Full blocks only: the fake block fills the whole cell.
blocks:
  - OAK_PLANKS
  - STONE
  - COBBLESTONE
  - BOOKSHELF
  - HAY_BLOCK
  - CRAFTING_TABLE
  - PUMPKIN
  - MELON

