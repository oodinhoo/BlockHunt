# Once this many players joined, the game starts on its own after the countdown (2 at least).
# An admin can still /bh start at once.
min-players: 2
countdown-seconds: 30

# Seekers are blinded and frozen while hiders run.
hide-seconds: 30
seek-seconds: 300

# A hider standing still this long turns into a real-looking block.
solidify-seconds: 3

# A hider right-clicking a block of the map takes its look, at most once per cooldown.
change-cooldown-seconds: 30

seekers: 1

# Seekers' sonar (recovery compass): right-click rings a bell at every hider's position.
sonar-cooldown-seconds: 45

# Hiders' rocket: a loud sound at their position, paid back by time off the clock.
taunts: 2
# The closer to a seeker, the more: taunt-max-seconds right next to one, then down evenly to
# nothing at taunt-range blocks (as the crow flies, through walls). A taunt that would take nothing
# off is refused and kept. 0 for either key turns taunts off.
taunt-max-seconds: 30
taunt-range: 32

# Each hider starts as one of these, at random. Any block is accepted, but full blocks blend in
# best: a slab or a torch still snaps onto the grid, and stands out there. Air, barriers, light and
# structure void are left out: a hider would be invisible.
blocks:
  - OAK_PLANKS
  - STONE
  - COBBLESTONE
  - BOOKSHELF
  - HAY_BLOCK
  - CRAFTING_TABLE
  - PUMPKIN
  - MELON

# The play area: a sphere of this radius, in blocks, around the arena spawn, so a dome above the
# ground and as deep below it. During a game, its players cannot leave it and nobody else can
# enter. 0 turns it off.
arena-radius: 40

# Arena spawn, written in game by /bh setspawn.
# spawn:
